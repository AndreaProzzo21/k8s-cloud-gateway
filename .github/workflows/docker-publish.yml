# -----------------------------------------------------------------------------
# PIPELINE: Build & Push Docker Images (Multi-Service)
# DESCRIZIONE: Automatizza la creazione delle immagini separate per frontend 
#              e backend, replicando la logica del docker-compose.yml.
# -----------------------------------------------------------------------------

name: Publish Docker Images

# 1. TRIGGER
# La pipeline si attiva automaticamente ad ogni push sul branch 'main'
# e può essere avviata manualmente tramite l'interfaccia GitHub (workflow_dispatch).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step A: Clona il codice sorgente dal repository all'interno dell'ambiente di CI
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Step B: Configura Docker Buildx (motore avanzato per cache e multi-arch)
      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step C: Login su Docker Hub utilizzando i Personal Access Token (PAT)
      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------
      # Step D: BUILD E PUSH DEL BACKEND (FastAPI)
      # ---------------------------------------------------
      - name: 🚀 Build and push BACKEND
        uses: docker/build-push-action@v5
        with:
          # Il contesto di esecuzione è isolato alla sola cartella backend
          context: ./backend
          file: ./backend/Dockerfile
          # Allineamento con il docker-compose: ferma la build allo stage 'prod'
          target: prod
          push: true
          # Assegna il tag 'latest' per la comodità di pull sul server
          # e il tag con il SHA del commit per garantire tracciabilità e rollback
          tags: |
            aprozzo/k8s-gateway-backend:latest
            aprozzo/k8s-gateway-backend:${{ github.sha }}

      # ---------------------------------------------------
      # Step E: BUILD E PUSH DEL FRONTEND (Nginx)
      # ---------------------------------------------------
      - name: 🚀 Build and push FRONTEND
        uses: docker/build-push-action@v5
        with:
          # Il contesto di esecuzione è isolato alla sola cartella frontend
          context: ./frontend
          file: ./frontend/Dockerfile
          # Nessun target specifico richiesto per il frontend in base al compose
          push: true
          tags: |
            aprozzo/k8s-gateway-frontend:latest
            aprozzo/k8s-gateway-frontend:${{ github.sha }}