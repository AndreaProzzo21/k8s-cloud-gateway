version: '3.8'

services:
  # --- BACKEND: API GATEWAY ---
  backend:
    image: aprozzo/k8s-gateway-backend:1.0.0
    container_name: k8s_gateway_backend_v1
    # Esposto internamente per il frontend, non accessibile dall'esterno
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Cartella locale per database e configurazioni persistenti
      - ./data:/app/data
      - helm_repos:/tmp/helm_repos
    networks:
      - k8s_network
    restart: always

  # --- FRONTEND: REVERSE PROXY & UI ---
  frontend:
    image: aprozzo/k8s-gateway-frontend:1.0.0
    container_name: k8s_gateway_frontend_v1
    ports:
      - "80:80" # Punto di accesso unico (Dashboard + API Proxy)
    networks:
      - k8s_network
    restart: always
    depends_on:
      - backend

networks:
  k8s_network:
    driver: bridge

volumes:
  helm_repos: