services:
  # --- BACKEND: API GATEWAY ---
  backend:
    image: aprozzo/k8s-gateway-backend:latest
    container_name: k8s_gateway_backend
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - helm_repos:/tmp/helm_repos
    networks:
      - k8s_network
    restart: unless-stopped
    # Limita l'uso della RAM per proteggere il server host (OOM Protection)
    deploy:
      resources:
        limits:
          memory: 512M
    # Log rotation: evita che i log riempiano il disco nel lungo periodo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- FRONTEND: REVERSE PROXY & UI ---
  frontend:
    image: aprozzo/k8s-gateway-frontend:latest
    container_name: k8s_gateway_frontend
    ports:
      - "80:80"
    networks:
      - k8s_network
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  k8s_network:
    driver: bridge

volumes:
  helm_repos: