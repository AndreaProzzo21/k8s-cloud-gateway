# ==============================================================================
#  K8s Multi-Cluster Access Gateway — Kubernetes manifest
#  https://github.com/AndreaProzzo21/k8s-cloud-gateway
#
#  BEFORE YOU APPLY — read the three sections below (< 5 minutes)
# ==============================================================================
#
# ── STEP 1 · CHECK PREREQUISITES ──────────────────────────────────────────────
#
#  Run this to see what your cluster already has:
#
#    kubectl version --short
#    kubectl get storageclass
#    kubectl get nodes
#
#  You need:
#    • kubectl configured and pointing at the right cluster
#    • At least one node Ready
#    • python3 available locally (used only to generate secret values)
#
# ── STEP 2 · STORAGE CLASS ────────────────────────────────────────────────────
#
#  The two PersistentVolumeClaims in this file do NOT specify a storageClassName.
#  Kubernetes will use whatever StorageClass is marked "(default)" in your cluster.
#  This works on most managed clusters (EKS, GKE, AKS, k3s) and on Minikube/Kind.
#
#  Run `kubectl get storageclass` and check the output:
#
#  CASE A — a "(default)" entry is listed → nothing to do, apply as-is.
#
#  CASE B — no "(default)" entry (common on bare-metal kubeadm clusters):
#    Install local-path-provisioner (single command, no dependencies):
#
#      kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.28/deploy/local-path-storage.yaml
#
#    This creates a "local-path" StorageClass and marks it as default.
#    Data is stored on the node under /opt/local-path-provisioner/.
#    Suitable for single-node and lab setups. For multi-node HA consider Longhorn.
#
#  CASE C — you have a StorageClass that is NOT the default and want it explicitly:
#    Find the two PVC resources below and uncomment the line:
#      # storageClassName: your-class-name
#
# ── STEP 3 · CREATE THE SECRET ────────────────────────────────────────────────
#
#  The Secret is intentionally NOT included in this manifest to prevent
#  accidentally applying placeholder values.
#
#  Run this block once — it generates cryptographically secure keys and
#  creates the Secret directly in the cluster:
#
#    kubectl create namespace k8s-gateway
#
#    kubectl create secret generic gateway-secret \
#      --namespace k8s-gateway \
#      --from-literal=JWT_SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))") \
#      --from-literal=JWT_SECRET_ALGORITHM=HS256 \
#      --from-literal=JWT_EXPIRE_HOURS=1 \
#      --from-literal=ADMIN_MASTER_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))") \
#      --from-literal=DATABASE_URL=data/gateway.db \
#      --from-literal=ENCRYPTION_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
#
#  Save the ADMIN_MASTER_KEY — you need it to access the Admin Console.
#  To retrieve it later:
#    kubectl get secret gateway-secret -n k8s-gateway \
#      -o jsonpath='{.data.ADMIN_MASTER_KEY}' | base64 -d && echo
#
# ── STEP 4 · CHOOSE HOW TO EXPOSE THE GATEWAY ─────────────────────────────────
#
#  Three options are at the bottom of this file. Only ONE must be active.
#
#  OPTION A · NodePort (default, active)
#    Works on any cluster. Access via http://<NODE_IP>:30090
#    Change nodePort if 30090 is already in use on your cluster.
#    Find your node IP: kubectl get nodes -o wide
#
#  OPTION B · LoadBalancer
#    For cloud clusters (EKS, GKE, AKS) or bare-metal with MetalLB.
#    An external IP is assigned automatically.
#
#  OPTION C · Ingress
#    For clusters with an Ingress controller. Supports custom domains and TLS.
#    Requires nginx-ingress, Traefik, or equivalent already installed.
#
# ── STEP 5 · APPLY ────────────────────────────────────────────────────────────
#
#    kubectl apply -f k8s-gateway.yaml
#
#  Watch pods start:
#    kubectl get pods -n k8s-gateway -w
#
#  Tail backend logs:
#    kubectl logs -n k8s-gateway -l app=backend -f
#
#  Once both pods are Running, open the URL matching your chosen exposure option.
#
# ==============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/managed-by: kubectl

---
# nginx configuration — proxies /api/v1 to the backend Service,
# serves static frontend files for all other paths.
# Edit this ConfigMap to change upstream timeouts or add custom headers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        # Frontend Static Files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy per le API del Backend
        # In Kubernetes il nome dell'upstream è il Service "backend-svc",
        # non "backend" come nel Docker Compose.
        location /api/v1 {
            proxy_pass http://backend-svc:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

---
# PersistentVolumeClaim — SQLite database and backend data
#
# storageClassName is omitted: Kubernetes uses your cluster's default StorageClass.
# See STEP 2 in the header if `kubectl get storageclass` shows no "(default)".
#
# To use a specific StorageClass, uncomment and edit:
#   storageClassName: your-class-name
#
# Do NOT reduce storage size after first apply — PVCs cannot shrink.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data-pvc
  namespace: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: your-class-name
  resources:
    requests:
      storage: 2Gi

---
# PersistentVolumeClaim — Helm repository cache
#
# Stores Helm repository indexes registered per cluster.
# Same StorageClass notes as gateway-data-pvc above apply.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: helm-repos-pvc
  namespace: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: your-class-name
  resources:
    requests:
      storage: 1Gi

---
# Backend Deployment — FastAPI application
#
# Reads all configuration from the Secret "gateway-secret" (see STEP 3).
# replicas is fixed at 1: both volumes are ReadWriteOnce (single-node attachment).
# To scale, migrate to a shared database and ReadWriteMany storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: k8s-gateway
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: aprozzo/k8s-gateway-backend:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: gateway-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: helm-repos
              mountPath: /tmp/helm_repos
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gateway-data-pvc
        - name: helm-repos
          persistentVolumeClaim:
            claimName: helm-repos-pvc

---
# Backend Service — ClusterIP (internal only)
# Never exposed outside the cluster. nginx proxies /api/v1 to this Service.
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# Frontend Deployment — Nginx
#
# Serves the static UI and proxies API calls to backend-svc.
# The nginx.conf ConfigMap is mounted with subPath so only that single file
# is replaced inside the container image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: k8s-gateway
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: aprozzo/k8s-gateway-frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

# ==============================================================================
#  EXPOSURE — activate exactly ONE option (A, B, or C)
# ==============================================================================

---
# ── OPTION A · NodePort (DEFAULT — active) ────────────────────────────────────
#
# Works on every Kubernetes cluster without additional components.
# Access the gateway at:  http://<NODE_IP>:30090
#
# Find your node IP:  kubectl get nodes -o wide
#   Use EXTERNAL-IP if available, otherwise INTERNAL-IP.
#
# If port 30090 is already allocated, change nodePort to any free value
# in the range 30000–32767.
#
# To switch to Option B or C: delete or comment out this entire block.
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: k8s-gateway
  labels:
    app.kubernetes.io/name: k8s-gateway
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30090
      protocol: TCP

# ── OPTION B · LoadBalancer ───────────────────────────────────────────────────
#
# Use on managed cloud clusters (EKS, GKE, AKS) or bare-metal with MetalLB.
# A cloud/MetalLB external IP is assigned automatically.
#
# After apply:
#   kubectl get svc frontend-svc -n k8s-gateway -w
# Wait for EXTERNAL-IP, then open http://<EXTERNAL-IP>
#
# To activate: comment out Option A above, uncomment this block.
#
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: frontend-svc
#   namespace: k8s-gateway
#   labels:
#     app.kubernetes.io/name: k8s-gateway
#     app.kubernetes.io/component: frontend
# spec:
#   type: LoadBalancer
#   selector:
#     app: frontend
#   ports:
#     - name: http
#       port: 80
#       targetPort: 80
#       protocol: TCP

# ── OPTION C · Ingress ────────────────────────────────────────────────────────
#
# Use when an Ingress controller is installed (nginx-ingress, Traefik, etc.)
# Supports custom hostnames and TLS certificates.
#
# Prerequisites:
#   - Ingress controller installed (nginx-ingress: https://kubernetes.github.io/ingress-nginx/deploy/)
#   - DNS record pointing your domain to the Ingress controller's external IP
#
# To activate:
#   1. Comment out Option A (or B).
#   2. Uncomment the ClusterIP Service and the Ingress resource below.
#   3. Replace k8s-gateway.example.com with your domain.
#   4. For automatic TLS via cert-manager, uncomment the tls and annotation lines.
#
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: frontend-svc
#   namespace: k8s-gateway
#   labels:
#     app.kubernetes.io/name: k8s-gateway
#     app.kubernetes.io/component: frontend
# spec:
#   type: ClusterIP
#   selector:
#     app: frontend
#   ports:
#     - name: http
#       port: 80
#       targetPort: 80
#       protocol: TCP
#
# ---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: gateway-ingress
#   namespace: k8s-gateway
#   labels:
#     app.kubernetes.io/name: k8s-gateway
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
#     nginx.ingress.kubernetes.io/proxy-body-size: "50m"
#     # cert-manager.io/cluster-issuer: "letsencrypt-prod"
# spec:
#   ingressClassName: nginx   # change to "traefik" or your controller's class
#   rules:
#     - host: k8s-gateway.example.com   # <── replace with your domain
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: frontend-svc
#                 port:
#                   number: 80
#   # tls:
#   #   - hosts:
#   #       - k8s-gateway.example.com
#   #     secretName: gateway-tls
